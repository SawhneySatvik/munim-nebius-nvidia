packages:
  - "apps/*"
  - "services/core-api"
  - "services/core-worker"
  - "packages/*"
  - "tools/*"
  - "adapters/gcp/*"
  - "adapters/dev/*"
  - "adapters/falkordb"
  - "e2e"
  - "tests/integration"
  - "db"
  - "evals"
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  esbuild: false
  unrs-resolver: false
