<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Beat 10 of the Nebius cut, on real screens: a question the books cannot back ("What will we sell on Diwali
         night?", asked live on 27 Oct, thread 01a17dea) answered with "Cannot verify"; then the invoice draft whose
         figures were read off the photo: no Approve button, "Some numbers in this draft don't trace to your books".
         Times: T.scenes.nbVerify. -->
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #v6-dev {
          left: 384px;
          top: 34px;
        }
        #v6-dev .dev-scale {
          transform: scale(0.86);
        }
      </style>
      <div data-hf-id="hf-79sq" id="root" data-composition-id="nbVerify" data-width="1920" data-height="1080">
        <div data-hf-id="hf-lltq" class="stage stage-ledger"><div data-hf-id="hf-h60x" class="grain"></div></div>
        <div data-hf-id="hf-1u65" class="cam" id="v6-cam"><div data-hf-id="hf-7vtz" id="v6-devwrap"></div><div data-hf-id="hf-prgn" class="fx" id="v6-fx"></div></div>
        <div data-hf-id="hf-bjg6" id="v6-pages"></div>
      </div>
      <script>
        NB.scene("nbVerify", "nbVerify", ({ tl, $, E, L, S }) => {
          $("v6-devwrap").innerHTML = SC.device("laptop", "v6-dev", [
            ["v6-ask", NB.screen("abstain", "v6a", [["answer"], ["cv"], ["asked"]])],
            ["v6-inv", NB.screen("invoice-draft", "v6i", [["card"], ["withhold"], ["reads"]])],
          ]);
          $("v6-pages").innerHTML = SC.pages("v6-");
          const cam = $("v6-cam");
          const fx = $("v6-fx");
          const M = MK.measure($("v6-dev"), () => ({
            answer: MK.rect($("v6a-answer"), cam), cv: MK.rect($("v6a-cv"), cam), asked: MK.rect($("v6a-asked"), cam),
            card: MK.rect($("v6i-card"), cam), withhold: MK.rect($("v6i-withhold"), cam), reads: MK.rect($("v6i-reads"), cam),
          }));
          SC.wipes(tl, $, "v6-", S, { outAt: E.wipeOut });
          MK.camera(tl, cam, { at: L(E.camAnswer), zoom: 1.45, x: M.answer.cx, y: (M.asked.y + M.answer.y + M.answer.h) / 2, anchor: [960, 430], dur: 0.9 });
          MK.encircle(tl, fx, M.cv, L(E.circleCv), { dur: 0.5, pad: 12, width: 6, until: L(E.toInvoice) });
          MK.camera(tl, cam, { at: L(E.circleCv) + 0.3, zoom: 1.6, x: M.answer.cx, y: M.cv.cy, anchor: [960, 440], dur: L(E.toInvoice) - L(E.circleCv) - 0.3, ease: "sine.inOut" });
          SC.swap(tl, $("v6-ask"), $("v6-inv"), L(E.toInvoice), { dur: 0.35, dx: 40 });
          MK.camera(tl, cam, { at: L(E.toInvoice) + 0.1, zoom: 1.3, x: M.card.cx, y: (M.reads.cy + M.withhold.cy) / 2, anchor: [960, 430], dur: 0.8 });
          MK.encircle(tl, fx, M.reads, L(E.circleReads), { dur: 0.5, pad: 10, width: 5 });
          MK.highlight(tl, fx, M.withhold, L(E.hlWithhold), { dur: 0.6, padX: 4, padY: 2 });
        });
      </script>
    </template>
  </body>
</html>
