<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Scene 8, Munim Cares at closing time: the expiry finding (20 sourdough loaves, ₹1,100.00 at cost), the donation
         proposal matched to the nearest recipient that can take it, pickup 9:00–10:30 pm, approved by the owner; after
         the pickup the owner home's "Food shared this month" counts up. The full tour asks Munim instead, and the
         answer carries its sources. -->
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #c8-dev {
          left: 384px;
          top: 34px;
        }
        #c8-dev .dev-scale {
          transform: scale(0.86);
        }
        #c8-chip,
        #c8-chip2 {
          left: 1612px;
          top: 112px;
          font-size: 30px;
        }
        #c8-st {
          left: 1180px;
          top: 690px;
        }
        #c8a-turns {
          position: relative;
          min-height: 300px;
        }
        .c8-turn {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
        }
      </style>
      <div data-hf-id="hf-cxuf" id="root" data-composition-id="cares" data-width="1920" data-height="1080">
        <div data-hf-id="hf-lltq" class="stage stage-ledger"><div data-hf-id="hf-h60x" class="grain"></div></div>
        <div data-hf-id="hf-ti8o" class="cam" id="c8-cam"><div data-hf-id="hf-p40y" id="c8-devwrap"></div><div data-hf-id="hf-9mbo" class="fx" id="c8-fx"></div></div>
        <div data-hf-id="hf-l74q" class="time-chip" id="c8-chip">Fri · 8:30 pm</div>
        <div data-hf-id="hf-9bn4" class="time-chip" id="c8-chip2">Fri · 9:20 pm</div>
        <div data-hf-id="hf-3kz9" class="sticker sticker-red" id="c8-st">Munim Cares</div>
        <div data-hf-id="hf-5357" id="c8-pages"></div>
      </div>
      <script>
        SC.scene("cares", "cares", ({ tl, $, E, L, S, F, has }) => {
          const layers = [["c8-page", UI.caresPage(F, "c8-")]];
          if (has("toHome")) layers.push(["c8-home", UI.ownerHome(F, "c8h-", { figures: F.ownerHomeLate })]);
          if (has("toAsk")) layers.push(["c8-ask", UI.askPage(F, "c8a-", { threads: [{ who: "Stock & Purchasing", q: "Why was butter waste so high this week?", when: "16 Oct, 11:02 am" }] })]);
          $("c8-devwrap").innerHTML = SC.device("laptop", "c8-dev", layers);
          $("c8-pages").innerHTML = SC.pages("c8-");
          if (has("toAsk")) $("c8a-turns").innerHTML = `<div class="c8-turn" id="c8-turn">${UI.askTurn("c8a-c-", F.ask.cares.q)}</div>`;
          const cam = $("c8-cam");
          const fx = $("c8-fx");
          const M = MK.measure($("c8-dev"), () => {
            const r = (id) => MK.rect($(id), cam);
            return { risk: r("c8-risk"), listing: r("c8-listing"), rank: r("c8-rank"), approve: r("c8-l-approve"), shared: has("toHome") ? r("c8h-packed") : null, ask: has("toAsk") ? r("c8a-ask") : null };
          });
          SC.wipes(tl, $, "c8-", S);
          MK.sticker(tl, $("c8-chip"), L(E.chip[0]), L(E.chip[1]), { rot: 3 });
          const leave = L(has("toHome") ? E.toHome : E.toAsk);
          MK.encircle(tl, fx, M.risk, L(E.encircleRisk), { dur: 0.55, pad: 14, width: 6, until: L(E.camListing) });
          // A slow creep toward the finding while the narrator reads it, so the line is not a still frame.
          MK.camera(tl, cam, { at: L(E.wipeIn) + 0.7, zoom: 1.14, x: M.risk.cx, y: M.risk.cy, anchor: [M.risk.cx, M.risk.cy], dur: L(E.camListing) - L(E.wipeIn) - 0.8, ease: "sine.inOut" });
          // The proposal: the camera moves to it; the ranking's first row; approved by the owner.
          MK.camera(tl, cam, { at: L(E.camListing), zoom: 1.3, x: M.listing.cx, y: M.listing.cy + 10, anchor: [960, 450], dur: 0.9 });
          const firstRow = $("c8-rank").querySelector("tbody tr");
          MK.highlight(tl, fx, MK.measure($("c8-dev"), () => MK.rect(firstRow, cam)), L(E.rank), { dur: 0.5, padX: 2, padY: 1, until: leave });
          const cur = MK.cursor(tl, fx, { x: M.approve.cx + 220, y: M.approve.cy + 120, hidden: true });
          cur.show(L(E.approve) - 1.0);
          cur.go({ at: L(E.approve) - 0.9, to: [M.approve.cx, M.approve.cy], dur: 0.8, state: "hand" });
          cur.click(L(E.approve), $("c8-l-approve"));
          cur.hide(L(E.approve) + 0.8);
          const status = $("c8-l-status");
          MK.drive(tl, (t) => {
            const done = t >= L(E.applied);
            status.textContent = done ? "Applied" : "Waiting for you";
            status.className = `badge ${done ? "badge-ready" : "badge-new"}`;
            $("c8-l-decide").style.visibility = done ? "hidden" : "visible";
          });
          MK.states(tl, $("c8-l-lineage"), [[0, "Proposed by Stock & Purchasing · 16 Oct, 8:31 pm · from a finding: Food at risk of going to waste"], [L(E.applied), `Proposed by Stock & Purchasing · 16 Oct, 8:31 pm · Approved by ${F.people.owner.name} · 16 Oct, 8:33 pm`]]);
          MK.camera(tl, cam, { at: leave - 0.2, zoom: 1, dur: 0.6 });

          if (has("toHome")) {
            // After the pickup: the owner home's food shared, counted up.
            SC.swap(tl, $("c8-page"), $("c8-home"), L(E.toHome));
            MK.sticker(tl, $("c8-chip2"), L(E.chip2[0]), L(E.chip2[1]), { rot: 3 });
            const c = F.cares;
            MK.count(tl, $("c8h-packed"), c.before.packed, c.after.packed, L(E.count), 1.2, (v) => String(Math.round(v)));
            MK.count(tl, $("c8h-handovers"), c.before.handovers, c.after.handovers, L(E.count) + 0.2, 0.8, (v) => String(Math.round(v)));
            MK.highlight(tl, fx, MK.measure($("c8-dev"), () => MK.rect($("c8h-packed").closest("ul"), cam)), L(E.count) + 1.3, { dur: 0.5 });
          }
          if (has("toAsk")) {
            // The full tour: ask Munim how much was shared; the answer carries its sources.
            SC.swap(tl, $("c8-page"), $("c8-ask"), L(E.toAsk));
            const a = F.ask.cares;
            SC.appear(tl, $("c8-turn"), L(E.ask), 0.25);
            const q = $("c8a-q");
            MK.drive(tl, (t) => {
              q.textContent = t >= L(E.typeQ) && t < L(E.ask) + 0.1 ? a.q.slice(0, Math.max(0, Math.floor((t - L(E.typeQ)) * 32))) : "";
              $("c8a-c-pending").style.display = t < L(E.answer) ? "" : "none";
              $("c8a-c-a").style.display = t >= L(E.answer) ? "" : "none";
            });
            MK.tap(tl, fx, { x: M.ask.cx, y: M.ask.cy }, L(E.ask));
            $("c8a-c-sig").textContent = `${a.via} · via Manager`;
            const chip = (text) => {
              const s = document.createElement("span");
              s.innerHTML = UI.sourced(text);
              return s;
            };
            const parts = a.parts.map((x) => (typeof x === "string" ? x : chip(x.kind === "count" ? String(x.value) : F.fmt.inr(x.value))));
            MK.stream(tl, $("c8a-c-body"), parts, L(E.think), { thinking: L(E.answer) - L(E.think), cps: 46, think: $("c8a-c-think") });
          }
          MK.sticker(tl, $("c8-st"), L(E.sticker[0]), L(E.sticker[1]), { rot: -2 });
        });
      </script>
    </template>
  </body>
</html>
