<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Scene 3, the morning brief (8:10 am): Nandini's owner home for Cobnut Hazratganj on a laptop (staff/pages/owner-home.tsx). The
         page turns off the ledger page; the figures count up; the camera finds "Most waste this week" and an ink circle
         goes round it; the cursor taps its Source chip; the snapshot drawer opens on the row and the highlighter sweeps
         it; the sticker carries "Every number traces to a row"; a fresh ledger page turns over the scene. Every time
         is read from the cut's clock (T.scenes.brief), so the same file serves both cuts. -->
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #b3-dev {
          left: 384px;
          top: 34px;
        }
        #b3-dev .dev-scale {
          transform: scale(0.86);
        }
        /* On the paper to the right of the laptop, clear of Cobnut's wordmark. */
        #b3-chip {
          left: 1612px;
          top: 112px;
          font-size: 30px;
        }
        #b3-sticker {
          left: 385px;
          top: 836px;
        }
        /* The margin note: the usual week's figure (the same snapshot cell the drawer shows), written beside the circle. */
        #b3-note {
          position: absolute;
          padding: 8px 16px 10px;
          font-size: 24px;
          text-transform: none;
          letter-spacing: 0;
          box-shadow: 4px 4px 0 var(--m-ink);
          border-width: 3px;
        }
        #b3-note .fig {
          font-size: 24px;
        }
      </style>
      <div data-hf-id="hf-bxgp" id="root" data-composition-id="brief" data-width="1920" data-height="1080">
        <div data-hf-id="hf-lltq" class="stage stage-ledger"><div data-hf-id="hf-h60x" class="grain"></div></div>
        <div data-hf-id="hf-jsfw" class="cam" id="b3-cam">
          <div data-hf-id="hf-0hd6" id="b3-devwrap"></div>
          <div data-hf-id="hf-9cdk" class="fx" id="b3-fx"></div>
          <div data-hf-id="hf-qbfr" class="sticker sticker-paper" id="b3-note"></div>
        </div>
        <div data-hf-id="hf-2tph" class="time-chip" id="b3-chip">Fri · 8:10 am</div>
        <div data-hf-id="hf-hqgr" class="sticker sticker-turmeric" id="b3-sticker">Every number traces to a row</div>
        <div data-hf-id="hf-44qr" class="mk-page" id="b3-page-in"></div>
        <div data-hf-id="hf-g4z3" class="mk-page-edge" id="b3-edge-in"></div>
        <div data-hf-id="hf-2x5q" class="mk-page" id="b3-page-out"></div>
        <div data-hf-id="hf-ebpe" class="mk-page-edge" id="b3-edge-out"></div>
      </div>
      <script>
        SC.scene("brief", "brief", ({ tl, $, E, D, L, S, F, has, root }) => {
          const h = F.ownerHome;

          const layers = [];
          if (has("picker")) layers.push(["b3-picker", UI.picker(F, "b3-")]);
          layers.push(["b3-home", UI.ownerHome(F, "b3-", { drawer: true })]);
          if (has("toAll")) layers.push(["b3-all", `<div class="cb-page">${UI.staffBar(F, "owner", "Home")}<main class="staff-main"><div class="scope-chips"><span class="chip">${UI.esc(F.outlets.hzg.name)}</span><span class="chip" aria-current="true">All outlets</span></div><h1 class="section-title">All outlets today</h1><p class="muted" style="margin-top:12px">Business date ${UI.esc(F.day.label)} · Figures are taken from the books when this page opens.</p></main>${UI.rollup(F, "b3r-")}</div>`]);
          $("b3-devwrap").innerHTML = SC.device("laptop", "b3-dev", layers);
          const cam = $("b3-cam");
          const fx = $("b3-fx");
          // Measure once, laid out, before any tween exists (rects in the camera rig's own pixels).
          const M = MK.measure(root, () => ({
            waste: MK.rect($("b3-waste"), cam),
            chip: MK.rect($("b3-waste-chip"), cam),
            card: MK.rect($("b3-waste-card"), cam),
            drawer: MK.rect($("b3-drawer"), cam),
            row: MK.rect($("b3-cited").parentElement, cam),
            needs: MK.rect($("b3-home").querySelector("section.needs"), cam),
            need1: MK.rect($("b3-home").querySelector(".need-title"), cam),
            signIn: has("picker") ? MK.rect($("b3-pk-owner").querySelector(".pk-btn"), cam) : null,
            allChip: has("toAll") ? MK.rect($("b3-scope-all"), cam) : null,
          }));

          // 0 · The full tour opens on the staff sign-in: four people, each with their own view; Nandini signs in.
          if (has("picker")) {
            ["owner", "manager", "counter", "kitchen"].forEach((k, i) => {
              const card = $(`b3-pk-${k}`);
              tl.fromTo(card, { boxShadow: "0 0 0 0 rgba(123,63,29,0)" }, { boxShadow: "0 0 0 4px rgba(123,63,29,0.9)", duration: 0.2, immediateRender: false }, L(E.roles) + i * D.roleStep);
              tl.fromTo(card, { boxShadow: "0 0 0 4px rgba(123,63,29,0.9)" }, { boxShadow: "0 0 0 0 rgba(123,63,29,0)", duration: 0.2, immediateRender: false }, L(E.roles) + (i + 1) * D.roleStep);
            });
            const pc = MK.cursor(tl, fx, { x: M.signIn.cx + 200, y: M.signIn.cy + 160, hidden: true });
            pc.show(L(E.signIn) - 1.0);
            pc.go({ at: L(E.signIn) - 0.9, to: [M.signIn.cx, M.signIn.cy], dur: 0.8, state: "hand" });
            pc.click(L(E.signIn), $("b3-pk-owner").querySelector(".pk-btn"));
            pc.hide(L(E.signIn) + 0.4);
            SC.swap(tl, $("b3-picker"), $("b3-home"), L(E.toHome));
          }

          // 1 · The ledger page turns away, the laptop rises, the time chip pops.
          MK.wipe(tl, $("b3-page-in"), L(E.wipeIn), { mode: "in", dur: S.d.wipe, edge: $("b3-edge-in") });
          tl.fromTo($("b3-dev"), { y: 170, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "power3.out", immediateRender: true }, L(E.laptopIn));
          MK.sticker(tl, $("b3-chip"), L(E.timeChip[0]), L(E.timeChip[1]), { rot: 3 });

          // 2 · The figures count up from zero, one card after another.
          const inr = (v) => F.fmt.inr(Math.round(v));
          const int = (v) => String(Math.round(v));
          [
            ["b3-orders", h.ordersToday, int], ["b3-tickets", h.ticketsToday, int], ["b3-sales", h.netSalesWeek, inr],
            ["b3-waste", h.waste.waste, inr], ["b3-packed", h.shared.packed, int], ["b3-handovers", h.shared.handovers, int],
          ].forEach(([id, to, f], i) => MK.count(tl, $(id), 0, to, L(E.countFrom) + i * S.d.countStep, S.d.count, f));

          // 2b · The full tour: one tap shows both outlets side by side, then back to Hazratganj.
          if (has("toAll")) {
            MK.tap(tl, fx, { x: M.allChip.cx, y: M.allChip.cy }, L(E.toAll));
            SC.swap(tl, $("b3-home"), $("b3-all"), L(E.toAll) + 0.1, { dur: 0.35, dx: 30 });
            SC.swap(tl, $("b3-all"), $("b3-home"), L(E.backOutlet), { dur: 0.35, dx: 30 });
          }

          // 3 · The camera finds the waste figure; an ink circle goes round it.
          MK.camera(tl, cam, { at: L(E.camWaste), zoom: 1.55, x: M.waste.cx + 60, y: M.waste.cy + 30, anchor: [900, 470], dur: 0.9 });
          MK.encircle(tl, fx, M.waste, L(E.encircle), { dur: 0.6, pad: 16, width: 6, until: has("drawerClose") ? L(E.drawerClose) : undefined });
          // While the narrator compares the week with a usual one, the camera keeps creeping in and the usual week's
          // figure is written beside the circle.
          MK.camera(tl, cam, { at: L(E.camDrift), zoom: 1.64, x: M.waste.cx + 60, y: M.waste.cy + 30, anchor: [900, 470], dur: L(E.usualNote[1]) - L(E.camDrift), ease: "sine.inOut" });
          const note = $("b3-note");
          note.innerHTML = `A usual week: <span class="fig">${F.fmt.inr(h.waste.median)}</span>`;
          note.style.left = `${M.card.x + M.card.w - 150}px`;
          note.style.top = `${M.card.y + M.card.h - 6}px`;
          MK.sticker(tl, note, L(E.usualNote[0]), L(E.usualNote[1]), { rot: -3 });

          // 4 · The cursor comes in and taps the Source chip.
          const cur = MK.cursor(tl, fx, { x: M.card.x + M.card.w + 40, y: M.card.y + M.card.h + 60, hidden: true });
          cur.show(L(E.cursorIn));
          cur.go({ at: L(E.cursorIn) + 0.1, to: [M.chip.cx, M.chip.cy], dur: S.d.cursorMove, state: "hand" });
          cur.click(L(E.clickChip), $("b3-waste-chip"));
          cur.hide(L(E.drawerOpen) + 0.5);

          // 5 · The snapshot drawer opens on its row; the camera follows; the highlighter sweeps the row.
          tl.fromTo($("b3-backdrop"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out", immediateRender: true }, L(E.drawerOpen));
          tl.fromTo($("b3-drawer"), { x: 440 }, { x: 0, duration: 0.38, ease: "power3.out", immediateRender: true }, L(E.drawerOpen));
          // The row sits a little above centre so the drawer's heading stays in frame and the captions stay clear.
          MK.camera(tl, cam, { at: L(E.camDrawer), zoom: 1.6, x: M.drawer.cx, y: M.row.cy + 50, anchor: [960, 470], dur: 0.8 });
          MK.highlight(tl, fx, M.row, L(E.highlight), { dur: 0.55, padX: 4, padY: 2, until: has("drawerClose") ? L(E.drawerClose) : undefined });

          // 6 · Back out for the sticker, then a fresh page turns over the scene.
          MK.camera(tl, cam, { at: L(E.camBack), zoom: 1, dur: 0.8 });
          MK.sticker(tl, $("b3-sticker"), L(E.sticker[0]), L(E.sticker[1]), { rot: -2 });

          // 7 · The full tour: the drawer closes and the camera finds "What needs you".
          if (has("drawerClose")) {
            tl.fromTo($("b3-backdrop"), { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, L(E.drawerClose));
            tl.fromTo($("b3-drawer"), { x: 0 }, { x: 440, duration: 0.35, ease: "power3.in", immediateRender: false }, L(E.drawerClose));
            MK.camera(tl, cam, { at: L(E.camNeeds), zoom: 1.4, x: M.needs.cx, y: M.needs.cy - 40, anchor: [920, 440], dur: 0.9 });
            MK.highlight(tl, fx, M.need1, L(E.camNeeds) + 1.2, { dur: 0.5, padX: 6, padY: 3 });
          }
          MK.wipe(tl, $("b3-page-out"), L(E.wipeOut), { mode: "out", dur: S.d.wipe, edge: $("b3-edge-out") });
        });
      </script>
    </template>
  </body>
</html>
