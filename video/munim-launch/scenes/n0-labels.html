<!doctype html>
<html>

  <body>
    <!-- The Nebius cut's standing label (hard rule 5): "Synthetic data · demo business" in the corner of every shot, over
         the scenes and under the captions. The supplier and payment labels sit in the scenes that show them. -->
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
      </style>
      <div data-hf-id="hf-gk38" id="root" data-composition-id="labels" data-width="1920" data-height="1080">
        <div data-hf-id="hf-xo5b" class="nb-corner" id="lb-corner"><i data-hf-id="hf-wt6k"></i>Synthetic data · demo business</div>
      </div>
      <script>
        MK.ready(() => {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(document.getElementById("lb-corner"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: true }, 0.2);
          MK.finish(tl, T.duration);
          window.__timelines["labels"] = tl;
        });
      </script>
    </template>
  </body>
