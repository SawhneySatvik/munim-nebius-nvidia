<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Beats 1–3 of the Nebius cut, on real screens (assets/screens/nebius): Nandini's owner home at Cobnut Hazratganj;
         Ask Munim with the reorder question typed, then the answered thread (Source chips on 0.143 and 1.322) and its
         Source drawer on the stock row; then the inbox finding, butter waste ₹4,872.00 against a usual week of
         ₹1,512.00, with the ink circles. Model tags are covered by placeholders until N3. Times: T.scenes.nbMorning. -->
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #m1-dev {
          left: 384px;
          top: 34px;
        }
        #m1-dev .dev-scale {
          transform: scale(0.86);
        }
        #m1-chip {
          left: 1560px;
          top: 112px;
          font-size: 28px;
        }
        #m1-sticker {
          left: 470px;
          top: 760px;
        }
        .m1-cover {
          position: absolute;
          background: #fff;
        }
        .m1-typed {
          position: absolute;
          overflow: hidden;
        }
        .m1-typed img {
          position: absolute;
          display: block;
        }
      </style>
      <div data-hf-id="hf-yddx" id="root" data-composition-id="nbMorning" data-width="1920" data-height="1080">
        <div data-hf-id="hf-lltq" class="stage stage-ledger"><div data-hf-id="hf-h60x" class="grain"></div></div>
        <div data-hf-id="hf-sjr7" class="cam" id="m1-cam"><div data-hf-id="hf-tued" id="m1-devwrap"></div><div data-hf-id="hf-o009" class="fx" id="m1-fx"></div></div>
        <div data-hf-id="hf-gk0g" class="time-chip" id="m1-chip">Seconds later</div>
        <div data-hf-id="hf-9m7k" class="sticker sticker-turmeric" id="m1-sticker">Every number traces to a row</div>
        <div data-hf-id="hf-syug" id="m1-pages"></div>
      </div>
      <script>
        NB.scene("nbMorning", "nbMorning", ({ tl, $, E, D, L, S }) => {
          const drawerX = NB.mark("thread-drawer", "drawer").x;
          $("m1-devwrap").innerHTML = SC.device("laptop", "m1-dev", [
            ["m1-home", NB.screen("home", "m1h", [["wasteCard"]])],
            ["m1-ask", NB.screen("ask-empty", "m1a", [["box"], ["ask"], ["panel"]])],
            ["m1-thread", NB.screen("thread", "m1t", [["answer"], ["onHand"], ["onHandChip"], ["minimum"]])],
            ["m1-drawer", NB.screen("thread-drawer", "m1d", [["drawer"]], { clipX: drawerX })],
            ["m1-inbox", NB.screen("inbox", "m1i", [["card"], ["waste", undefined, 2], ["usual", undefined, 2]])],
          ]);
          $("m1-pages").innerHTML = SC.pages("m1-");
          // The drawer's cited cell, its first line (the figure), as a hotspot.
          const cell = NB.mark("thread-drawer", "cell");
          $("m1d-shot").insertAdjacentHTML("beforeend", NB.hot("m1d-fig", { x: cell.x + 6, y: cell.y + 8, w: cell.w - 12, h: 30 }));
          // Typing: an empty box over the placeholder, and a window onto the shot with the question typed, opening one
          // character at a time.
          const box = NB.mark("ask-empty", "box");
          const inner = { x: box.x + 2, y: box.y + 2, w: box.w - 4, h: box.h - 4 };
          const filled = NB.shot("ask-filled");
          $("m1a-shot").insertAdjacentHTML("beforeend", `<div class="m1-cover" id="m1-cover" style="left:${inner.x}px;top:${inner.y}px;width:${inner.w}px;height:${inner.h}px;opacity:0"></div><div class="m1-typed" id="m1-typed" style="left:${inner.x}px;top:${inner.y}px;width:0px;height:${inner.h}px"><img src="${NB.dir}${filled.file}" alt="" style="left:${-inner.x}px;top:${-inner.y}px;width:1280px;height:${filled.h}px" /></div>`);

          const cam = $("m1-cam");
          const fx = $("m1-fx");
          const M = MK.measure($("m1-dev"), () => ({
            screen: MK.rect($("m1-dev-screen"), cam),
            card: MK.rect($("m1h-wasteCard"), cam),
            panel: MK.rect($("m1a-panel"), cam),
            box: MK.rect($("m1a-box"), cam),
            ask: MK.rect($("m1a-ask"), cam),
            answer: MK.rect($("m1t-answer"), cam),
            onHand: MK.rect($("m1t-onHand"), cam),
            chip: MK.rect($("m1t-onHandChip"), cam),
            minimum: MK.rect($("m1t-minimum"), cam),
            drawer: MK.rect($("m1d-drawer"), cam),
            fig: MK.rect($("m1d-fig"), cam),
            finding: MK.rect($("m1i-card"), cam),
            waste: MK.rect($("m1i-waste"), cam),
            usual: MK.rect($("m1i-usual"), cam),
          }));

          // 1 · The laptop is already open on her home; the camera eases in on the day's figures.
          tl.fromTo($("m1-dev"), { y: 90, opacity: 0 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", immediateRender: true }, L(E.laptopIn));
          MK.camera(tl, cam, { at: L(E.camPush), zoom: 1.12, x: M.screen.cx - 60, y: M.screen.y + 330, anchor: [900, 430], dur: L(E.toAsk) - L(E.camPush), ease: "sine.inOut" });

          // 2 · Ask Munim: the question typed, asked; seconds later the answer, every figure with its Source chip.
          SC.swap(tl, $("m1-home"), $("m1-ask"), L(E.toAsk), { dur: 0.35, dx: 40 });
          MK.camera(tl, cam, { at: L(E.camAsk), zoom: 1.5, x: M.panel.cx, y: M.box.cy + 40, anchor: [960, 440], dur: 0.7 });
          tl.fromTo($("m1-cover"), { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, L(E.type));
          const q = "Which ingredients are below their reorder level?";
          const charW = 7.75; // Inter 16 px, this question's average advance in the shot (365 px for 48 characters)
          MK.drive(tl, (t) => {
            const n = Math.max(0, Math.min(q.length, Math.floor((t - L(E.type)) * D.cps)));
            $("m1-typed").style.width = `${n === q.length ? inner.w : n === 0 ? 0 : 14 + n * charW}px`;
          });
          const cur = MK.cursor(tl, fx, { x: M.box.x + M.box.w * 0.6, y: M.box.y + M.box.h + 60, hidden: true });
          cur.show(L(E.clickAsk) - 0.8);
          cur.go({ at: L(E.clickAsk) - 0.7, to: [M.ask.cx, M.ask.cy], dur: 0.6, state: "hand" });
          cur.click(L(E.clickAsk));
          cur.hide(L(E.clickAsk) + 0.3);
          SC.swap(tl, $("m1-ask"), $("m1-thread"), L(E.toThread), { dur: 0.35, dx: 40 });
          MK.sticker(tl, $("m1-chip"), L(E.chip[0]), L(E.chip[1]), { rot: 3 });
          MK.camera(tl, cam, { at: L(E.camAnswer), zoom: 1.55, x: M.answer.cx, y: M.answer.cy, anchor: [960, 450], dur: 0.8 });
          MK.highlight(tl, fx, M.onHand, L(E.hlOnHand), { dur: 0.4, padX: 4, padY: 2, until: L(E.toDrawer) });
          MK.highlight(tl, fx, M.minimum, L(E.hlMin), { dur: 0.4, padX: 4, padY: 2, until: L(E.toDrawer) });
          MK.encircle(tl, fx, M.chip, L(E.circleChip), { dur: 0.5, pad: 10, width: 5, until: L(E.toDrawer) });

          // 3 · Tap the chip: the Source drawer opens on the stock row, the figure highlighted.
          const cur2 = MK.cursor(tl, fx, { x: M.chip.cx + 160, y: M.chip.cy + 120, hidden: true });
          cur2.show(L(E.clickChip) - 1.0);
          cur2.go({ at: L(E.clickChip) - 0.9, to: [M.chip.cx, M.chip.cy], dur: 0.8, state: "hand" });
          cur2.click(L(E.clickChip));
          cur2.hide(L(E.clickChip) + 0.25);
          tl.fromTo($("m1-drawer"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", immediateRender: false }, L(E.toDrawer));
          tl.fromTo($("m1-thread"), { opacity: 1 }, { opacity: 0, duration: 0.01, immediateRender: false }, L(E.toDrawer) + 0.3);
          MK.camera(tl, cam, { at: L(E.camDrawer), zoom: 1.6, x: M.drawer.cx, y: M.fig.cy + 60, anchor: [1100, 440], dur: 0.8 });
          MK.highlight(tl, fx, M.fig, L(E.hlFig), { dur: 0.45, padX: 4, padY: 2, until: L(E.toInbox) });

          // ... and Munim found a leak: the waste finding, this week against a usual one.
          SC.swap(tl, $("m1-drawer"), $("m1-inbox"), L(E.toInbox), { dur: 0.35, dx: 40 });
          MK.camera(tl, cam, { at: L(E.toInbox) + 0.1, zoom: 1.32, x: M.finding.cx, y: M.finding.cy, anchor: [960, 440], dur: 0.8 });
          MK.encircle(tl, fx, M.waste, L(E.circleWaste), { dur: 0.55, pad: 14, width: 6 });
          MK.encircle(tl, fx, M.usual, L(E.circleUsual), { dur: 0.55, pad: 14, width: 6, seed: 11, tilt: 3 });
          MK.camera(tl, cam, { at: L(E.circleUsual) + 0.7, zoom: 1.2, x: M.finding.cx, y: M.finding.cy - 40, anchor: [960, 400], dur: L(E.wipeOut) - L(E.circleUsual) - 0.7, ease: "sine.inOut" });
          MK.sticker(tl, $("m1-sticker"), L(E.sticker[0]), L(E.sticker[1]), { rot: -2 });
          SC.wipes(tl, $, "m1-", S, { skipIn: true, outAt: E.wipeOut });
        });
      </script>
    </template>
  </body>
</html>
